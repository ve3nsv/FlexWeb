# Manual cleanup of Actions storage. Every build uploads ~0.7 GB of
# artifacts that are also published as the branch's Dev release; with 30-day
# retention they reached 46 GB (2026-11-10). This deletes every artifact
# except those of the newest run of each branch, and the Actions caches.
name: Cleanup artifacts

on:
  workflow_dispatch:
    inputs:
      keep_latest:
        description: "Keep the artifacts of the newest run of each branch"
        type: boolean
        default: true

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const keepLatest = `${{ inputs.keep_latest }}` !== 'false';
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo,
                                              { owner, repo, per_page: 100 });
            const live = all.filter(a => !a.expired);
            const newest = {};
            for (const a of live) {
              const br = (a.workflow_run && a.workflow_run.head_branch) || '?';
              const id = (a.workflow_run && a.workflow_run.id) || 0;
              if (!newest[br] || id > newest[br]) newest[br] = id;
            }
            let n = 0, bytes = 0, kept = 0;
            for (const a of live) {
              const br = (a.workflow_run && a.workflow_run.head_branch) || '?';
              const id = (a.workflow_run && a.workflow_run.id) || 0;
              if (keepLatest && id === newest[br]) { kept++; continue; }
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
                n++; bytes += a.size_in_bytes;
              } catch (e) {
                core.warning(`artifact ${a.id} ${a.name}: ${e.message}`);
              }
            }
            core.notice(`Deleted ${n} artifacts, ${(bytes / 1e9).toFixed(2)} GB; kept ${kept} (newest run of each branch).`);
            const caches = await github.paginate(github.rest.actions.getActionsCacheList,
                                                 { owner, repo, per_page: 100 });
            let c = 0;
            for (const k of caches) {
              try { await github.rest.actions.deleteActionsCacheById({ owner, repo, cache_id: k.id }); c++; }
              catch (e) { core.warning(`cache ${k.id}: ${e.message}`); }
            }
            core.notice(`Deleted ${c} Actions caches.`);
